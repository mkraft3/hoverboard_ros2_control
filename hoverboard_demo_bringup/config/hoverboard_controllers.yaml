controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hoverboard_base_controller:
      type: diff_drive_controller/DiffDriveController

hoverboard_base_controller:
  ros__parameters:
    left_wheel_names: ["driving_wheel_left_joint"]
    right_wheel_names: ["driving_wheel_right_joint"]

    wheel_separation: 0.63   # ANPASSEN: Radmitte zu Radmitte nachmessen
    wheel_radius: 0.125    # 6.5" Hoverboard-Rad

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 100.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true
    position_feedback: false

    cmd_vel_timeout: 0.5
    # Jazzy: use_stamped_vel gibt es nicht mehr.
    # Controller hoert immer auf ~/cmd_vel mit geometry_msgs/TwistStamped.

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: false
    linear.x.max_velocity: 1.2
    linear.x.min_velocity: -1.2
    linear.x.has_acceleration_limits: false
    linear.x.max_acceleration: 1.5

    angular.z.has_velocity_limits: false
    angular.z.max_velocity: 2.5
    angular.z.min_velocity: -2.5
    angular.z.has_acceleration_limits: false
    angular.z.max_acceleration: 3.0
